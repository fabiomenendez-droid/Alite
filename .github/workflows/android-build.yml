name: Alite Android 15

on:
  push:
    branches: [android15-port]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android15-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/android15-port' || github.head_ref == 'android15-port'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0' 'platform-tools'
      - name: Build APKs, run unit tests and Android lint
        run: ./gradlew --no-daemon --console=plain assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
      - name: Verify complete offline APK
        run: bash scripts/verify-apk.sh build/outputs/apk/debug/Alite-debug.apk | tee build/apk-verification.txt
      - name: Prepare download
        run: |
          mkdir -p artifacts
          cp build/outputs/apk/debug/Alite-debug.apk artifacts/Alite-1.5.9-Android15-debug.apk
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Alite-1.5.9-Android15-debug.apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Alite-instrumentation-apk
          path: build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Alite-build-reports
          path: |
            build/reports/
            build/test-results/
            build/apk-verification.txt

  android15-emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: Alite-1.5.9-Android15-debug.apk
          path: artifacts/app
      - uses: actions/download-artifact@v4
        with:
          name: Alite-instrumentation-apk
          path: artifacts/test
      - name: Enable hardware acceleration on GitHub runner
        run: |
          sudo chmod a+rw /dev/kvm
      - name: Android 15 install, startup, rendering, input and save/load tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: bash scripts/emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Alite-Android15-emulator-evidence
          path: artifacts/emulator/
          if-no-files-found: warn
          retention-days: 30
